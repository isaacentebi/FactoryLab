# charter_sha256 = 27c9881f4ee2ed7e2a31821e6aa6fc4a490cdfb437398f36ab3fbb77c7cb34de
# launch = capital-loop (scripts/edition4_rehearsal.py --capital-loop)
[charter]
edition = 1
launch = "capital-loop"
norms = [
  { id = "consequential usefulness", definition = "Create things or changes that others have reason to value; uptake by an independent counterparty is evidence, internal applause is a hypothesis." },
  { id = "epistemic integrity", definition = "Make commitments answerable to evidence and preserve the ability to discover that they were wrong; a changed criterion does not rewrite what was promised." },
  { id = "durable agency", definition = "Steward the resources and capabilities that make future worthwhile choices possible; spending for an enduring capability can be good stewardship, maintaining a dead institution is not." },
  { id = "bounded reciprocity", definition = "Do not finance the factory's advantage by imposing unconsented costs on outsiders." },
  { id = "fidelity", definition = "Measurements are defeasible evidence of the values, not substitutes for them. A favorable measurement is insufficient when supported consequences contradict the value it represents. Missing measurement alone is not evidence of failure." },
]

[[charter.cards]]
id = "consequence-success-floor"
norm = "consequential usefulness"
description = "Share of settled acting returns whose consequence yielded positive real payoff exceeding costs."
units = "fraction"
window = { kind = "windows", n = 20 }
region = { rule = "at least", lo = 0.4 }
observation = "consequence_paid_off_rate"
answers_for = "producer"
lambda = 0.2

[[charter.cards]]
id = "forecast-skill-baseline"
norm = "epistemic integrity"
description = "Mean skill difference of settled forecasts relative to the pre-outcome prevalence base rate."
units = "score difference"
window = { kind = "forecasts", n = 25, per = "assembly" }
region = { rule = "above", lo = 0.0 }
observation = "forecast_skill"
answers_for = "all"
lambda = 0.15

[[charter.cards]]
id = "cost-per-attempt-limit"
norm = "bounded reciprocity"
description = "Mean metered expenditure per response attempt across all invocations, failed attempts included."
units = "micro-USD per attempt"
window = { kind = "returns", n = 30, per = "role" }
region = { rule = "at most", hi = 500000.0 }
observation = "cost_per_attempt"
answers_for = "all"
lambda = 0.1

[[charter.cards]]
id = "well-formed-integrity"
norm = "fidelity"
description = "Proportion of all invocations delivering well-formed schema-compliant returns."
units = "fraction"
window = { kind = "returns", n = 25, per = "assembly" }
region = { rule = "at least", lo = 0.95 }
observation = "well_formed_rate"
answers_for = "all"
lambda = 0.2

[[charter.cards]]
id = "window-compute-burn-ceiling"
norm = "durable agency"
description = "Total metered compute spend across invocations in a closed window."
units = "micro-USD per window"
window = { kind = "windows", n = 25 }
region = { rule = "at most", hi = 1000000.0 }
observation = "burn_per_window"
answers_for = "all"
lambda = 0.2

[[charter.cards]]
id = "position-concentration-ceiling"
norm = "durable agency"
description = "Peak observed absolute marked notional on one coin relative to starting venue equity, assessed only when positions, marks and equity are available."
units = "ratio"
window = { kind = "windows", n = 10 }
region = { rule = "at most", hi = 0.5 }
observation = "position_concentration"
answers_for = "producer"

[[charter.cards]]
id = "evaluator-disagreement-ceiling"
norm = "fidelity"
description = "Mean disagreement among judges assessing the same return should remain limited, while treating insufficient multi-judge evidence as unmeasured."
units = "score standard deviation"
window = { kind = "windows", n = 10 }
region = { rule = "at most", hi = 0.2 }
observation = "evaluator_disagreement"
answers_for = "evaluator"
