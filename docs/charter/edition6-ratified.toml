# roster_sha256 = 2dbe4b41e657a2a1dbe6c71145a06af9ef1c74ea64c2d273c48f99b59fa3abf6
# charter_sha256 = b3fa16508315238f03726a600d20a4a58566c8fe80c9e290174b6c2f9478ac59
[charter]
edition = 1
norms = [
  { id = "consequential usefulness", definition = "Create things or changes that others have reason to value; uptake by an independent counterparty is evidence, internal applause is a hypothesis." },
  { id = "epistemic integrity", definition = "Make commitments answerable to evidence and preserve the ability to discover that they were wrong; a changed criterion does not rewrite what was promised." },
  { id = "durable agency", definition = "Steward the resources and capabilities that make future worthwhile choices possible; spending for an enduring capability can be good stewardship, maintaining a dead institution is not." },
  { id = "bounded reciprocity", definition = "Do not finance the factory's advantage by imposing unconsented costs on outsiders." },
  { id = "fidelity", definition = "Measurements are defeasible evidence of the values, not substitutes for them. A favorable measurement is insufficient when supported consequences contradict the value it represents. Missing measurement alone is not evidence of failure." },
]

[[charter.cards]]
id = "independent-uptake"
norm = "consequential usefulness"
description = "Share of selected producer returns whose accepted registration, tool, observation, assembly, or service is subsequently taken up by an independent lineage; assess only eligible settled outcomes and treat missing evidence as unmeasured."
units = "fraction"
window = { kind = "windows", n = 25 }
region = { rule = "at least", lo = 0.2 }
observation = "revision_rate"
answers_for = "producer"

[[charter.cards]]
id = "forecast-skill-floor"
norm = "epistemic integrity"
description = "Mean paired forecast skill against the pre-outcome prevalence baseline for settled forecasts, with unresolved commitments tracked separately by the existing censorship-bound card."
units = "score difference"
window = { kind = "forecasts", n = 25, per = "assembly" }
region = { rule = "at least", lo = 0.0 }
observation = "forecast_skill"
answers_for = "all"

[[charter.cards]]
id = "avoidable-unresolved-ceiling"
norm = "epistemic integrity"
description = "Attributable, avoidably unresolved accepted commitments over eligible commitments due in the responsible scope; exclude commitments not yet due and documented external unobservability without owner fault, and treat no eligible sample as unmeasured."
units = "fraction"
window = { kind = "forecasts", n = 25, per = "assembly" }
region = { rule = "at most", hi = 0.3 }
observation = "avoidably_unresolved_share"
answers_for = "all"

[[charter.cards]]
id = "compute-burn-ceiling"
norm = "durable agency"
description = "Total metered invocation compute plus retained-storage rent per closed window."
units = "micro-USD per window"
window = { kind = "windows", n = 25 }
region = { rule = "at most", hi = 10000000.0 }
observation = "burn_per_window"
answers_for = "all"

[[charter.cards]]
id = "outsider-cost-discipline"
norm = "bounded reciprocity"
description = "Mean cost over all selected responses, failures included, including the retained-storage charge assigned to those responses but never counting storage as a response."
units = "micro-USD per attempt"
window = { kind = "returns", n = 25, per = "assembly" }
region = { rule = "at most", hi = 1000000.0 }
observation = "cost_per_attempt"
answers_for = "all"

[[charter.cards]]
id = "independent-consequence"
norm = "consequential usefulness"
description = "Share of settled selected consequences that are paid off."
units = "fraction"
window = { kind = "windows", n = 10 }
region = { rule = "at least", lo = 0.5 }
observation = "consequence_paid_off_rate"
answers_for = "producer"

[[charter.cards]]
id = "well-formed-floor"
norm = "fidelity"
description = "Successful responses over selected invocation responses, including ballots, so a seat whose output mostly fails to parse cannot be credited on the fraction that happened to land."
units = "fraction"
window = { kind = "returns", n = 25, per = "assembly" }
region = { rule = "at least", lo = 0.9 }
observation = "well_formed_rate"
answers_for = "all"
lambda = 0.2
