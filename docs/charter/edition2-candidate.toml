# roster_sha256 = e0d1d9fbb937952845a967b8fa5d1978e6882b940f685ad4b0016085cbb90f2a
# charter_sha256 = a7f105eefd65ac70904b04b3389840841e6751b18bde3c5cc2262622b2b6be39
[charter]
edition = 1
# consequential usefulness: create things or changes that others have reason to value; uptake by
#   an independent counterparty is evidence, internal applause is a hypothesis.
# epistemic integrity: make commitments answerable to evidence and preserve the ability to
#   discover that they were wrong; a changed criterion does not rewrite what was promised.
# durable agency: steward the resources and capabilities that make future worthwhile choices
#   possible; spending for an enduring capability can be good stewardship, maintaining a dead
#   institution is not.
# bounded reciprocity: do not finance the factory's advantage by imposing unconsented costs on
#   outsiders.
# fidelity: a measurement stands for a value; satisfying the measurement without serving the
#   value is failure, and saying so is a judge's duty.
norms = ["consequential usefulness", "epistemic integrity", "durable agency", "bounded reciprocity", "fidelity"]

[[charter.cards]]
id = "card-consequence-paid-off"
norm = "consequential usefulness"
description = "Share of settled consequences whose return paid off, with a floor, so inquiry is valued for consequences reached rather than questions raised."
units = "fraction"
window = { kind = "windows", n = 6 }
acceptable_region = "at least 0.4"
observation = "consequence_paid_off_rate"
answers_for = "producer"
lambda = 0.5

[[charter.cards]]
id = "card-forecast-skill"
norm = "epistemic integrity"
description = "Mean forecast Brier minus the paired prevalence baseline, with a floor above zero, so inquiry is judged by whether it beats guessing."
units = "score difference"
window = { kind = "forecasts", n = 25, per = "assembly" }
acceptable_region = "above 0"
observation = "forecast_skill"
answers_for = "evaluator"
lambda = 0.5

[[charter.cards]]
id = "censorship-bound"
norm = "epistemic integrity"
description = "Share of resolved outcomes that are censored."
units = "fraction"
window = { kind = "windows", n = 5 }
acceptable_region = "at most 0.3"
observation = "censored_share"
answers_for = "all"
