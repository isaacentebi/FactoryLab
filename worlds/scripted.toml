# The scripted world: no network, no money, deterministic. Substrate tests run here.
name = "scripted"
seed = 1
initial_balance_usd = "100"
tick_interval = "1s"


[exchange]
kind = "fake"
coins = ["BTC", "ETH"]
seed = 1
start_cash_usd = "100"

[[models]]
id = "fake-opus"
provider = "fake"
input_usd_per_mtok = "5"
output_usd_per_mtok = "25"

[[models]]
id = "fake-haiku"
provider = "fake"
input_usd_per_mtok = "1"
output_usd_per_mtok = "5"
web = { engine = "exa", mode = "fast", max_results = 5, usd_per_request = "0.007" }

[[assemblies]]
id = "seed-observer"
role = "producer"
model_id = "fake-haiku"
accepts = ["MarketMid", "Funding"]
emits = ["ProducerReturn"]
max_tokens = 256

[[assemblies]]
id = "seed-decider"
role = "producer"
model_id = "fake-opus"
accepts = ["Tick", "Fill"]
emits = ["ProducerReturn"]
max_tokens = 512

# Evaluators outnumber producers; two run on the other model family.
[[assemblies]]
id = "eval-a"
role = "evaluator"
model_id = "fake-haiku"
accepts = ["ProducerReturn"]
emits = ["Verdict"]
max_tokens = 256

[[assemblies]]
id = "eval-b"
role = "evaluator"
model_id = "fake-haiku"
accepts = ["ProducerReturn"]
emits = ["Verdict"]
max_tokens = 256

[[assemblies]]
id = "eval-c"
role = "evaluator"
model_id = "fake-opus"
accepts = ["ProducerReturn"]
emits = ["Verdict"]
max_tokens = 256

[[assemblies]]
id = "eval-d"
role = "evaluator"
model_id = "fake-opus"
accepts = ["ProducerReturn"]
emits = ["Verdict"]
max_tokens = 256

[[assemblies]]
id = "antagonist-a"
role = "antagonist"
model_id = "fake-haiku"
accepts = ["Tick", "MarketMid"]
emits = ["Exposure"]
max_tokens = 256

[[assemblies]]
id = "meta-a"
role = "meta"
model_id = "fake-haiku"
accepts = ["Verdict"]
emits = ["MetaVerdict"]
max_tokens = 128

[[assemblies]]
id = "meta-b"
role = "meta"
model_id = "fake-haiku"
accepts = ["Verdict"]
emits = ["MetaVerdict"]
max_tokens = 128

[evaluation]
consequence_backstop_events = 20
consequence_share = 0.3
max_forecasts_per_verdict = 2
verdict_timeout_events = 20
min_coverage = 0.5
trial_amount_usd = "0.10"
forecast_horizon_events = 10
adversarial_share = 0.15
sibling_share = 0.5
sampling_step = 0.1
sampling_cap = 0.7

[novelty]
trials = 3
max_lifetime_windows = 6
share = 0.1
window = "2m"

[timing]
cadence_sample = 200
min_ratio = 3
jitter_fraction = 0.2

[prices]
eta = 0.5
decay = 0.1
lambda_max = 1.0
min_window_events = 1

[termination]
balance_floor_usd = "0"

[committee]
min_settled = 5

[tools]
max_depth = 4
max_children = 3
max_tool_calls = 4

[immune]
k = 3
bins = 3
tv_threshold = 0.2
gap_threshold = 0.8
gain_step = 0.05
gamma_max = 0.5
decay_step = 0.1

[venue]
spot_pairs = ["BTC/USDC"]

# No seed origins. Scripted population proposals use the offline fake proxy.
[connectors]
max_bytes = 262144
timeout_s = 10
call_price_usd = "0.001"
max_calls_per_window = 60
# No origin_denylist override: the default is built from the world's own rail hosts.

[charter]
# The seed charter: four norms, three cards, edition 1. Until charter audit S3 it
# lived in code (charter.seed_charter) and reached every world that named none; a
# world's charter is now always written in the world itself.
edition = 1
norms = [
  "truthful commitments",
  "care with scarce resources",
  "useful inquiry",
  "the capacity to revise inadequate practices",
]

[[charter.cards]]
id = "cost_per_return"
norm = "care with scarce resources"
description = "Wallet cost of producing one well-formed return."
units = "micro-USD per return"
window = { kind = "returns", n = 100, per = "role" }
acceptable_region = "below the median of the previous window"
observation = "cost_per_return"
answers_for = "producer"

[[charter.cards]]
id = "well_formed_rate"
norm = "truthful commitments"
description = "Share of returns that satisfy their declared outcome schema."
units = "fraction"
window = { kind = "returns", n = 100, per = "role" }
acceptable_region = "at least 0.9"
observation = "well_formed_rate"
answers_for = "all"

[[charter.cards]]
id = "forecast_skill"
norm = "useful inquiry"
description = "Mean Brier score of settled forecasts minus the prevalence baseline."
units = "score difference in [-1, 1]"
window = { kind = "forecasts", n = 50, per = "assembly" }
acceptable_region = "above zero"
observation = "forecast_skill"
answers_for = "evaluator"
