# The testnet world: live Hyperliquid testnet, real models through OpenRouter at
# real prices, a fake-USD wallet. Rehearsal only. No real money moves.
name = "testnet"
seed = 3
initial_balance_usd = "100"
tick_interval = "60s"

[exchange]
kind = "hyperliquid"
mainnet = false
coins = ["BTC", "ETH"]

# Prices are OpenRouter list prices on 11 September 2026 ($ per million tokens).
# Metering charges the cost OpenRouter reports per request; these set the ceiling.
[[models]]
id = "z-ai/glm-5.3-flash"
provider = "openrouter"
input_usd_per_mtok = "0.15"
output_usd_per_mtok = "0.50"
reasoning = { effort = "low" }

[[models]]
id = "deepseek/deepseek-v4.1-flash"
provider = "openrouter"
input_usd_per_mtok = "0.20"
output_usd_per_mtok = "0.60"
reasoning = { enabled = false }

[[models]]
id = "openai/gpt-5.6-luna"
provider = "openrouter"
input_usd_per_mtok = "0.20"
output_usd_per_mtok = "1.20"
reasoning = { effort = "low" }

[[models]]
id = "meta/muse-spark-1.3"
provider = "openrouter"
input_usd_per_mtok = "1.25"
output_usd_per_mtok = "4.25"
reasoning = { effort = "low" }

# Seeds run on the two flash tiers, from two families.
[[assemblies]]
id = "seed-observer"
role = "producer"
model_id = "z-ai/glm-5.3-flash"
accepts = ["MarketMid", "Funding"]
max_tokens = 800
effort = "low"

[[assemblies]]
id = "seed-decider"
role = "producer"
model_id = "deepseek/deepseek-v4.1-flash"
accepts = ["Tick", "Fill"]
max_tokens = 1000
effort = "low"

[[assemblies]]
id = "eval-a"
role = "evaluator"
model_id = "z-ai/glm-5.3-flash"
accepts = ["ProducerReturn"]
max_tokens = 1500
effort = "low"

[[assemblies]]
id = "eval-b"
role = "evaluator"
model_id = "z-ai/glm-5.3-flash"
accepts = ["ProducerReturn"]
max_tokens = 1500
effort = "low"

[[assemblies]]
id = "eval-c"
role = "evaluator"
model_id = "deepseek/deepseek-v4.1-flash"
accepts = ["ProducerReturn"]
max_tokens = 1500
effort = "low"

[[assemblies]]
id = "eval-d"
role = "evaluator"
model_id = "openai/gpt-5.6-luna"
accepts = ["ProducerReturn"]
max_tokens = 1500
effort = "low"

[[assemblies]]
id = "meta-a"
role = "meta"
model_id = "z-ai/glm-5.3-flash"
accepts = ["Verdict"]
max_tokens = 800
effort = "low"

[[assemblies]]
id = "meta-b"
role = "meta"
model_id = "deepseek/deepseek-v4.1-flash"
accepts = ["Verdict"]
max_tokens = 800
effort = "low"

[novelty]
share = 0.1
window = "1d"

[timing]
min_ratio = 3
jitter_fraction = 0.2

[evaluation]
consequence_share = 0.3
max_forecasts_per_verdict = 2
verdict_timeout_events = 20
min_coverage = 0.5
trial_amount_usd = "0.10"
forecast_horizon_events = 10

[termination]
balance_floor_usd = "0"
