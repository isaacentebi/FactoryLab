# The tape library: recorded markets a fake venue may replay (factorylab/world/tape.py),
# by market regime, with a sealed holdout.
#
# A tape is identified by the SHA-256 of its compact form (`fastloop.py tape <diary>`),
# whatever file carried it; `source` is the paid diary it was cut from, under the
# operator's untracked work/ directory. `scripts/fastloop.py run --tape-from` looks
# every tape up here: a holdout tape runs only with `--release-candidate`, and only
# for plumbing invariants (critique H4). Seeds on one tape vary the routers, not the
# market, so a scorecard names its tape and seeds are read nested within tapes.
#
# Tape P&L, and any action-mix figure a tape run produces, is never evidence for a
# code change: iterating code against a tape until its card looks right is the
# architect optimizing toward its own "better" (AGENTS.md rule 2).
#
# Regimes are facts measured on the tape, by these rules (BTC and ETH mids):
#   trend         the net move over the tape is at least 0.5% on either coin
#   chop          neither coin moved 0.5% net
#   jump          one recorded step moved a coin at least 0.5%
#   funding_flip  a coin's recorded funding rate changed sign
#   outage        a delivered tick gap of 300 s or more
# On a tape every perp position is margined at 1x (the recording states no leverage
# terms), so no recorded gap reaches a liquidation: the fake venue's scripted shocks
# remain the stress tape for that regime. An order needs a recorded listing that states
# the account's fee rates and a recorded book; no tape here has both (longrun1 read
# books but its listing states no rates; the others read no book), so each replays
# prices, funding and the clock and refuses every order, saying why.

