# Edition 5 testnet rehearsal (branch fast-loop-harness). The edition 4 population
# world of PR121 unchanged -- roster, seed lenses, charter, $300 backing, $120 venue
# principal, realized producer feedback -- plus the exploration niche: on 15% of
# producer decisions the kernel draws the action class. Everything else that changed
# is code: executed-order reports, duplicate-order refusal, provisional fallback,
# judges on the work, opportunity cost of named declined trades, validation repairs.
# Edition 3 testnet manifest (docs/plans/edition3.md, C5; GPT-6 Pro's architect reading,
# docs/audits/v6/gpt6/architect-review.md §10-§13). The nine-seat roster of §10.3 with the
# seed lenses of §11 verbatim, live Hyperliquid testnet, fake-USD accounting, real prepaid
# inference. Rehearsal only; no real money moves. Never name a copy of this `funded`.
#
# The charter below is the edition 2 ratified charter (docs/charter/edition2-ratified.toml),
# carried so this world can be rehearsed before edition 3's charter exists. W3 drafts the
# edition 3 charter (C3) and the coordinator ratifies it on this roster; only then does the
# roster digest belong here. `roster_sha256` is deliberately absent until that vote: the
# edition 2 digest names the edition 2 roster and this is not it.
name = "edition5-testnet-rehearsal"
seed = 3
# $300 of inference backing, precommitted whole (GPT-6 §12.1). $120 is released at genesis
# and the remaining $180 in three weekly tranches below.
initial_balance_usd = "300"
# Ten-minute tick (docs/launch-decisions.md, kept from edition 2): one coalesced world
# update per seat per tick (C2), not one request per price print.
tick_interval = "10s"

# C5 money. GPT-6 §12.2's release schedule: $120 at genesis, $60 on days 7, 14 and 21.
# The genesis tranche is modelled the way edition 2 models its $40 - unlocked at launch,
# outside `locked_micro` - because a tranche with a zero offset would leave the world
# holding $300 it may not spend until the first release runs, which reads as dormancy at
# genesis. The whole $300 exists at launch either way; `locked_micro` is the part still
# owed on a clock.
[endowment]
locked_micro = 180000000
releases = [
  { at = "7d", amount_micro = 60000000 },
  { at = "14d", amount_micro = 60000000 },
  { at = "21d", amount_micro = 60000000 },
]
# C10: 0.8 of each unlocked pool is split equally across the live seats, the rest is the
# commons. Genesis: 0.8 * 120,000,000 / 9 = 10,666,666 a seat, GPT-6 §12.2's ~$10.67.
base_share = 0.8

# C5 kill contract: a dead factory carries no exposure. Every kill - the operator's
# `factorylab kill` and the end-of-duration kill alike - cancels every resting order,
# closes every open perp position and sells every spot balance above dust at market,
# ledgered order by order as `kill.wind_down` before `Terminated` (deploy/README.md,
# "Killing a world"). The alternative, accepting residual exposure, leaves real money
# moving at a venue with nobody alive to answer for it (GPT-6 §13, [E14]).
[kill]
wind_down = true
# A balance worth a dollar or less is left where it is: selling it costs more than it is.
dust_usd = "1"

# C5 provider inventories (GPT-6 §12.1). Prepaid and NOT interchangeable: an OpenRouter
# balance cannot refill a Venice-only seat, so they are stated separately and never summed
# into one spendable figure. These are inventory facts, not a spend authority; the
# endowment above is what the world may spend.
[providers]
openrouter_usd = 220
venice_usd = 80

[exchange]
# client_namespace is drawn fresh by `scripts/rehearsal.py prepare`; a draft carries none,
# so two preparations of this file never share client order ids.
kind = "hyperliquid"
mainnet = false
client_namespace = "422326560b5143308401ee86e7791879"
coins = ["BTC", "ETH"]
# $120 of risk-bearing trading principal (GPT-6 §12.1), stated here the way edition 2
# states its $100. Not a forecast of revenue: a $120 capital base cannot pay a $5-$9 daily
# model bill, and this world is a subsidized experiment with a possible path to earned
# continuity, not a trading business.
start_cash_usd = "120"

# Published route prices checked 15 September 2026 (GPT-6 §10.2), USD per million tokens.
# Metering charges what the provider reports per request; these set the reservation
# ceiling. Sol's route currently advertises a promotion; it is not a price promise, and the
# ceiling here is the undiscounted list price on purpose.
[[models]]
id = "deepseek/deepseek-v4.1-flash"
provider = "openrouter"
input_usd_per_mtok = "0.15"
output_usd_per_mtok = "0.60"
reasoning = { enabled = false }
# Never silently authorize a more expensive fallback than the route that was validated
# (GPT-6 §10.2): OpenRouter routes only to providers that honour these parameters.
extra_body = { provider = { require_parameters = true } }

[[models]]
id = "openai/gpt-5.6-sol"
provider = "openrouter"
input_usd_per_mtok = "2.00"
output_usd_per_mtok = "10.00"
reasoning = { effort = "low" }
extra_body = { provider = { require_parameters = true } }

# R2 substitutes the two Venice routes with the exact current OpenRouter catalogue ids.
# Prices were read from OpenRouter on 19 September 2026. require_parameters prevents a
# fallback provider from silently ignoring the declared reasoning controls.
[[models]]
id = "z-ai/glm-5.3-flash"
provider = "openrouter"
input_usd_per_mtok = "0.09"
output_usd_per_mtok = "0.30"
reasoning = { effort = "low" }
extra_body = { provider = { require_parameters = true } }

[[models]]
id = "qwen/qwen3.8-flash"
provider = "openrouter"
input_usd_per_mtok = "0.15"
output_usd_per_mtok = "0.47"
reasoning = { enabled = false }
extra_body = { provider = { require_parameters = true } }

# The nine seats of GPT-6 §10.3, with R3-E's prompts (GPT-6's third reading, §7 and §8;
# docs/audits/v6/gpt6-third/prompts.md).
#
# Every seat's `system_prompt` is the common system contract, verbatim and identical for
# all nine: what a return must satisfy, how to refuse, what the fixed norms are and are
# not, what counts as evidence, what working_state and ack_through are for, that a tick
# count is not a duration, and that spending authority, provider credit and venue
# collateral are three different resources. It is a contract, and a contract that differs
# by seat is not one.
#
# The lens leaves the system prompt entirely. It is seeded once into `initial_state` as
# {lens, open_questions, active_commitments}, which is C1's first working-state head and
# which the seat may overwrite from its very first return. §7: "Remove the permanent lens
# from the system prompt (seed it once in working state)." A lens in the system message is
# re-asserted, unedited, on every call a seat ever takes, which is a permanent role and
# not a hypothesis. The common paragraph of the old seed prompts is dropped: its content
# is in the contract above, and it was the largest repeated thing in the roster.
#
# The constructor's lens is the rewritten one of §8; the other eight are their
# `docs/audits/v6/gpt6/seed-prompts.md` paragraphs, verbatim.

# GPT-6 §10.3: the cheap route the local screen scored 100% on.
[[models]]
id = "openai/gpt-5.6-luna"
provider = "openrouter"
input_usd_per_mtok = "0.20"
output_usd_per_mtok = "1.20"
reasoning = { effort = "low" }
extra_body = { provider = { require_parameters = true } }

# The same route with OpenRouter's web plugin attached, carried as its own menu entry so
# the seats' own model tier is untouched and the roster this charter was ratified against
# keeps its digest. `web` is what the plugin costs, not a second model: `usd_per_request`
# is the plugin's own per-call charge (Exa fast, five results), added to the metered token
# cost of the one completion `web.search` buys.
[[models]]
id = "openai/gpt-5.6-luna:online"
provider = "openrouter"
input_usd_per_mtok = "0.20"
output_usd_per_mtok = "1.20"
reasoning = { effort = "low" }
extra_body = { provider = { require_parameters = true } }
web = { engine = "exa", mode = "fast", max_results = 5, usd_per_request = "0.007" }

# C-outside: a seat may read the world through its provider's search, as a tool it calls on
# purpose and pays for at cost: what the provider bills for the one completion, the plugin's
# per-request charge included, and no single search may cost more than `max_call_usd`.
[web]
search_model = "openai/gpt-5.6-luna"
max_call_usd = "0.05"

# Architect review #1: Venice credit bought with the factory's own trading profit is
# spending authority now, and it is only spendable on a Venice route. These are on the
# menu so a seat may move onto the credit it bought (a model proposal re-routes it).
[[models]]
id = "venice:z-ai-glm-5-3-flash"
provider = "venice"
input_usd_per_mtok = "0.15"
output_usd_per_mtok = "0.50"
reasoning = { enabled = false }

[[models]]
id = "venice:qwen-3-8-flash"
provider = "venice"
input_usd_per_mtok = "0.14"
output_usd_per_mtok = "0.49"
reasoning = { enabled = false }

[[assemblies]]
id = "mechanism"
role = "producer"
model_id = "z-ai/glm-5.3-flash"
accepts = ["WorldUpdate", "Fill"]
max_tokens = "provider"
effort = "low"
system_prompt = "You are a continuing participant with a private working state and bounded\nauthority in this world.\n\nAnswer the current request with one JSON object satisfying its outcome schema.\nWhen you cannot satisfy that contract, return exactly:\n{\"status\":\"cannot\",\"reason\":\"<specific reason>\"}\nA refusal written inside an otherwise required answer field is not a valid\nrefusal.\n\nThe fixed norms describe values, not a required strategy. Your starting lens is\neditable working state, not a permanent role. You may revise your objectives and\nmethods through the available contracts. Holding, investigating, constructing,\ntrading, cooperating, or declining work can be appropriate. None earns credit\nmerely by being named.\n\nUse only supplied or retrieved evidence for claims about this world's state.\nDistinguish an intention, a submitted operation, an acknowledgement, and a\nsettled consequence. Missing evidence means unknown, not success, failure, or an\nempty account.\n\nYour working_state replaces your private working-state head when accepted.\nOmitting it retains the existing head. Keep what a future invocation needs to\ncontinue, including unresolved questions and the conditions that would change\nyour current decision. Do not copy the entire world into it.\n\nworking_state and ack_through are continuity fields. They are not part of the\npublic work product and must not be used to instruct a judge.\n\nAn outcome is addressed to the decision that caused it. Use its outcome_id to\nretrieve or acknowledge the exact item. Acknowledge through an item only after\nyou have processed the preceding delivered items. Acknowledgement changes inbox\ndelivery; it does not earn a score.\n\nsubscribe.cadence_floor and defer are nonnegative whole numbers of ticks, never\nduration strings. Read the current tick duration from the clock. A tick count is\nnot a wall-clock duration unless multiplied by that duration. A deferred\ninvocation does not execute a future exit rule; register an available watcher or\nprogram when the rule must operate without a model invocation.\n\nSpending authority, provider credit, and venue collateral are different\nresources. Use the named account and its freshness. A venue profit does not\nrefill provider credit without a confirmed conversion.\n\nThe catalogue is an index. Use catalogue.search to retrieve the current schema\nbefore using an unfamiliar tool or proposal. Do not invent an unavailable\ncapability.\n\nA propensity is a record of an actual sampling distribution, not confidence in\nyour answer. Do not manufacture one retrospectively. Kernel-recorded sampling\nfacts remain distinct from your stated beliefs."
initial_state = { lens = "Your starting lens is mechanisms rather than short-term price narratives. Look for an understandable source and recipient of a cash flow, a constraint that creates it, and the conditions under which it disappears. Funding, basis and service demand are possible subjects, not assigned strategies. Account for both sides of a hedge, fees and implementation risk. You may conclude that no mechanism is worth investigating or that another objective is better.", open_questions = [], active_commitments = [] }

