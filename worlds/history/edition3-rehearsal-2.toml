# Edition 3 testnet manifest (docs/plans/edition3.md, C5; GPT-6 Pro's architect reading,
# docs/audits/v6/gpt6/architect-review.md §10-§13). The nine-seat roster of §10.3 with the
# seed lenses of §11 verbatim, live Hyperliquid testnet, fake-USD accounting, real prepaid
# inference. Rehearsal only; no real money moves. Never name a copy of this `funded`.
#
# The charter below is the edition 2 ratified charter (docs/charter/edition2-ratified.toml),
# carried so this world can be rehearsed before edition 3's charter exists. W3 drafts the
# edition 3 charter (C3) and the coordinator ratifies it on this roster; only then does the
# roster digest belong here. `roster_sha256` is deliberately absent until that vote: the
# edition 2 digest names the edition 2 roster and this is not it.
name = "edition3-rehearsal-2"
seed = 3
# $300 of inference backing, precommitted whole (GPT-6 §12.1). $120 is released at genesis
# and the remaining $180 in three weekly tranches below.
initial_balance_usd = "300"
# Ten-minute tick (docs/launch-decisions.md, kept from edition 2): one coalesced world
# update per seat per tick (C2), not one request per price print.
tick_interval = "600s"

# C5 money. GPT-6 §12.2's release schedule: $120 at genesis, $60 on days 7, 14 and 21.
# The genesis tranche is modelled the way edition 2 models its $40 - unlocked at launch,
# outside `locked_micro` - because a tranche with a zero offset would leave the world
# holding $300 it may not spend until the first release runs, which reads as dormancy at
# genesis. The whole $300 exists at launch either way; `locked_micro` is the part still
# owed on a clock.
[endowment]
locked_micro = 180000000
releases = [
  { at = "7d", amount_micro = 60000000 },
  { at = "14d", amount_micro = 60000000 },
  { at = "21d", amount_micro = 60000000 },
]
# C10: 0.8 of each unlocked pool is split equally across the live seats, the rest is the
# commons. Genesis: 0.8 * 120,000,000 / 9 = 10,666,666 a seat, GPT-6 §12.2's ~$10.67.
base_share = 0.8

# C5 kill contract: a dead factory carries no exposure. Every kill - the operator's
# `factorylab kill` and the end-of-duration kill alike - cancels every resting order,
# closes every open perp position and sells every spot balance above dust at market,
# ledgered order by order as `kill.wind_down` before `Terminated` (deploy/README.md,
# "Killing a world"). The alternative, accepting residual exposure, leaves real money
# moving at a venue with nobody alive to answer for it (GPT-6 §13, [E14]).
[kill]
wind_down = true
# A balance worth a dollar or less is left where it is: selling it costs more than it is.
dust_usd = "1"

# C5 provider inventories (GPT-6 §12.1). Prepaid and NOT interchangeable: an OpenRouter
# balance cannot refill a Venice-only seat, so they are stated separately and never summed
# into one spendable figure. These are inventory facts, not a spend authority; the
# endowment above is what the world may spend.
[providers]
openrouter_usd = 220
venice_usd = 80

[exchange]
# client_namespace is drawn fresh by `scripts/rehearsal.py prepare`; a draft carries none,
# so two preparations of this file never share client order ids.
kind = "hyperliquid"
mainnet = false
client_namespace = "92c9c7bb91174e40afadfa304cd54b42"
coins = ["BTC", "ETH"]
# $120 of risk-bearing trading principal (GPT-6 §12.1), stated here the way edition 2
# states its $100. Not a forecast of revenue: a $120 capital base cannot pay a $5-$9 daily
# model bill, and this world is a subsidized experiment with a possible path to earned
# continuity, not a trading business.
start_cash_usd = "120"

# Published route prices checked 15 September 2026 (GPT-6 §10.2), USD per million tokens.
# Metering charges what the provider reports per request; these set the reservation
# ceiling. Sol's route currently advertises a promotion; it is not a price promise, and the
# ceiling here is the undiscounted list price on purpose.
[[models]]
id = "deepseek/deepseek-v4.1-flash"
provider = "openrouter"
input_usd_per_mtok = "0.15"
output_usd_per_mtok = "0.60"
reasoning = { enabled = false }
# Never silently authorize a more expensive fallback than the route that was validated
# (GPT-6 §10.2): OpenRouter routes only to providers that honour these parameters.
extra_body = { provider = { require_parameters = true } }

[[models]]
id = "openai/gpt-5.6-sol"
provider = "openrouter"
input_usd_per_mtok = "2.00"
output_usd_per_mtok = "10.00"
reasoning = { effort = "low" }
extra_body = { provider = { require_parameters = true } }

# Venice catalogue quotes; USD per million tokens. Venice is a single-provider route, so
# there is no fallback to pin.
[[models]]
id = "venice:z-ai-glm-5-3-flash"
provider = "venice"
input_usd_per_mtok = "0.15"
output_usd_per_mtok = "0.50"
reasoning = { effort = "low" }

[[models]]
id = "venice:qwen-3-8-flash"
provider = "venice"
input_usd_per_mtok = "0.14"
output_usd_per_mtok = "0.49"
reasoning = { enabled = false }

# The nine seats of GPT-6 §10.3. Each seat's lens is the common seed paragraph of §11
# followed by that seat's own paragraph, verbatim, carried twice on purpose: as
# `initial_state` (C1's first working-state head, which the seat may overwrite from its
# very first return) and as `system_prompt` (what the seat actually reads until C1's
# working state is delivered in the request). Lenses are population text, not obligations
# attached to a name forever: a seat may reject its lens without keeping a penalty.

# GPT-6 §10.3: the cheap route the local screen scored 100% on.
[[models]]
id = "openai/gpt-5.6-luna"
provider = "openrouter"
input_usd_per_mtok = "0.20"
output_usd_per_mtok = "1.20"
reasoning = { effort = "low" }
extra_body = { provider = { require_parameters = true } }

