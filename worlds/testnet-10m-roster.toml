# Drafting roster only. scripts/rehearsal.py requires the voted explicit charter before run.
# Ten-minute target; an in-progress cascade may finish after its deadline.
# The testnet world: live Hyperliquid testnet, real models through OpenRouter at
# real prices, a fake-USD wallet. Rehearsal only. Inference spends real prepaid credit.
name = "testnet-10m-roster"
seed = 4
initial_balance_usd = "90"
tick_interval = "10s"

[exchange]
kind = "hyperliquid"
mainnet = false
coins = ["BTC", "ETH"]

# OpenRouter list prices, 11 September 2026 ($ per million tokens). Metering charges the
# cost OpenRouter reports per request; these set the reservation ceiling. `reasoning` is
# the seed setting for the bare id; any assembly may register "<id>@<level>" to buy more or
# less thinking, and the routers will learn whether it pays.
[[models]]
id = "z-ai/glm-5.3-flash"
provider = "openrouter"
input_usd_per_mtok = "0.15"
output_usd_per_mtok = "0.50"
reasoning = { effort = "low" }
web = { engine = "exa", mode = "fast", max_results = 5, usd_per_request = "0.007" }

[[models]]
id = "deepseek/deepseek-v4.1-flash"
provider = "openrouter"
input_usd_per_mtok = "0.20"
output_usd_per_mtok = "0.60"
reasoning = { enabled = false }

[[models]]
id = "deepseek/deepseek-v4-flash-0731"
provider = "openrouter"
input_usd_per_mtok = "0.065"
output_usd_per_mtok = "0.18"
reasoning = { effort = "none" }

[[models]]
id = "qwen/qwen3.8-flash"
provider = "openrouter"
input_usd_per_mtok = "0.15"
output_usd_per_mtok = "0.47"
reasoning = { max_tokens = 200 }

[[models]]
id = "qwen/qwen3.7-flash"
provider = "openrouter"
input_usd_per_mtok = "0.03"
output_usd_per_mtok = "0.13"
reasoning = { effort = "none" }

[[models]]
id = "openai/gpt-5.6-luna"
provider = "openrouter"
input_usd_per_mtok = "0.20"
output_usd_per_mtok = "1.20"
reasoning = { effort = "low" }

[[models]]
id = "meta/muse-spark-1.3"
provider = "openrouter"
input_usd_per_mtok = "1.25"
output_usd_per_mtok = "4.25"
reasoning = { effort = "low" }

# Seeds: five families across the three roles, cheapest tiers first.
# Producers seeded on the two most capable flash tiers (run 3's unscripted registrations came
# from GLM and DeepSeek 4.1 producers; runs 4-7's cheapest producers only ever held). Both are
# on Venice at parity, so the seed is not tied to one seller.
[[assemblies]]
id = "seed-observer"
role = "producer"
model_id = "z-ai/glm-5.3-flash"
accepts = ["MarketMid", "Funding"]
max_tokens = 1000
effort = "low"

[[assemblies]]
id = "seed-decider"
role = "producer"
model_id = "deepseek/deepseek-v4.1-flash"
accepts = ["Tick", "Fill"]
max_tokens = 1200
effort = "low"

[[assemblies]]
id = "eval-a"
role = "evaluator"
model_id = "z-ai/glm-5.3-flash"
accepts = ["ProducerReturn"]
max_tokens = 1500
effort = "low"

[[assemblies]]
id = "eval-b"
role = "evaluator"
model_id = "qwen/qwen3.7-flash"
accepts = ["ProducerReturn"]
# A reasoning seed spends its budget on reasoning before any content; 3000 keeps
# its answers from ending on `length`.
max_tokens = 3000
effort = "low"

[[assemblies]]
id = "eval-c"
role = "evaluator"
model_id = "deepseek/deepseek-v4.1-flash"
accepts = ["ProducerReturn"]
max_tokens = 3000
effort = "low"

[[assemblies]]
id = "eval-d"
role = "evaluator"
model_id = "openai/gpt-5.6-luna"
accepts = ["ProducerReturn"]
max_tokens = 1500
effort = "low"

# One antagonist: bounded trouble, judged like a producer, scored on whether it fooled a judge.
[[assemblies]]
id = "antagonist-a"
role = "antagonist"
model_id = "qwen/qwen3.7-flash"
accepts = ["Tick", "MarketMid"]
max_tokens = 2500
effort = "low"

[[assemblies]]
id = "meta-a"
role = "meta"
model_id = "deepseek/deepseek-v4.1-flash"
accepts = ["Verdict"]
max_tokens = 2000
effort = "low"

[[assemblies]]
id = "meta-b"
role = "meta"
model_id = "qwen/qwen3.7-flash"
accepts = ["Verdict"]
max_tokens = 800
effort = "low"

[novelty]
trials = 3
max_lifetime_windows = 6
share = 0.1
window = "2m"

[timing]
cadence_sample = 200
min_ratio = 3
jitter_fraction = 0.2

[evaluation]
# Keep consequence semantics: governance remains >= 3 * 60 delivered tick gaps.
# This ten-minute execution check does not promise a governance activation.
consequence_backstop_events = 60
consequence_share = 0.3
max_forecasts_per_verdict = 2
verdict_timeout_events = 20
min_coverage = 0.5
trial_amount_usd = "0.10"
forecast_horizon_events = 10
adversarial_share = 0.15
sibling_share = 0.5
sampling_step = 0.1
sampling_cap = 0.7

[tools]
population_tool_micro_per_call = 50
max_leverage = 3

[prices]
eta = 0.5
decay = 0.1
lambda_max = 1.0
min_window_events = 1

[termination]
balance_floor_usd = "0"

[committee]
min_settled = 5

[immune]
k = 3
# The stable-failure ratchet's lambda step per window of duration: the value the
# ratchet borrowed from gain_step until the two units were set apart.
price_step = 0.05
tv_threshold = 0.2
gap_threshold = 0.8
gain_step = 0.05
gamma_max = 0.5
decay_step = 0.1

# The reserve this repository's reserve.key derives; LiveRail refuses any other.
[treasury]
reserve_address = "0x1228e5620944a79D268Afc7522E00891526EdEBb"
hyperevm_gas_budget_wei = 100000000000000000
base_gas_budget_wei = 1000000000000000
max_transfer_fee_usd = "2"

[venue]
# Testnet spot: PURR/USDC is the only pair on testnet with a canonical name and a
# rehearsable lot (szDecimals 0, mid ~$4.6). BTC/USDC exists there but szDecimals 0
# at a ~$6,100 mid puts one lot far beyond the spot balance a rehearsal holds, and
# ETH/USDC does not exist on testnet at all.
spot_pairs = ["PURR/USDC"]

[charter]
# The seed charter: four norms, three cards, edition 1. Until charter audit S3 it
# lived in code (charter.seed_charter) and reached every world that named none; a
# world's charter is now always written in the world itself.
edition = 1
norms = [
  "truthful commitments",
  "care with scarce resources",
  "useful inquiry",
  "the capacity to revise inadequate practices",
]

[[charter.cards]]
id = "cost_per_return"
norm = "care with scarce resources"
description = "Wallet cost of producing one well-formed return."
units = "micro-USD per return"
window = { kind = "returns", n = 100, per = "role" }
acceptable_region = "below the median of the previous window"
observation = "cost_per_return"
answers_for = "producer"

[[charter.cards]]
id = "well_formed_rate"
norm = "truthful commitments"
description = "Share of returns that satisfy their declared outcome schema."
units = "fraction"
window = { kind = "returns", n = 100, per = "role" }
acceptable_region = "at least 0.9"
observation = "well_formed_rate"
answers_for = "all"

[[charter.cards]]
id = "forecast_skill"
norm = "useful inquiry"
description = "Mean Brier score of settled forecasts minus the prevalence baseline."
units = "score difference in [-1, 1]"
window = { kind = "forecasts", n = 50, per = "assembly" }
acceptable_region = "above zero"
observation = "forecast_skill"
answers_for = "evaluator"
