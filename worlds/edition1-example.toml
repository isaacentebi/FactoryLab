# Typed schema migration of the historical example; re-draft with the launch roster before use.
# The testnet world: live Hyperliquid testnet, real models through OpenRouter at
# real prices, a fake-USD wallet. Rehearsal only. No real money moves.
name = "edition1-example"
seed = 4
initial_balance_usd = "100"
tick_interval = "60s"

[exchange]
kind = "hyperliquid"
mainnet = false
coins = ["BTC", "ETH"]

# OpenRouter list prices, 11 September 2026 ($ per million tokens). Metering charges the
# cost OpenRouter reports per request; these set the reservation ceiling. `reasoning` is
# the seed setting for the bare id; any assembly may register "<id>@<level>" to buy more or
# less thinking, and the routers will learn whether it pays.
[[models]]
id = "z-ai/glm-5.3-flash"
provider = "openrouter"
input_usd_per_mtok = "0.15"
output_usd_per_mtok = "0.50"
reasoning = { effort = "low" }
web = { engine = "exa", mode = "fast", max_results = 5, usd_per_request = "0.007" }

[[models]]
id = "deepseek/deepseek-v4.1-flash"
provider = "openrouter"
input_usd_per_mtok = "0.20"
output_usd_per_mtok = "0.60"
reasoning = { enabled = false }

[[models]]
id = "deepseek/deepseek-v4-flash-0731"
provider = "openrouter"
input_usd_per_mtok = "0.065"
output_usd_per_mtok = "0.18"
reasoning = { effort = "none" }

[[models]]
id = "qwen/qwen3.8-flash"
provider = "openrouter"
input_usd_per_mtok = "0.15"
output_usd_per_mtok = "0.47"
reasoning = { max_tokens = 200 }

[[models]]
id = "qwen/qwen3.7-flash"
provider = "openrouter"
input_usd_per_mtok = "0.03"
output_usd_per_mtok = "0.13"
reasoning = { effort = "none" }

[[models]]
id = "tencent/hy3"
provider = "openrouter"
input_usd_per_mtok = "0.0825"
output_usd_per_mtok = "0.33"
reasoning = { effort = "none" }

[[models]]
id = "openai/gpt-5.6-luna"
provider = "openrouter"
input_usd_per_mtok = "0.20"
output_usd_per_mtok = "1.20"
reasoning = { effort = "low" }

[[models]]
id = "meta/muse-spark-1.3"
provider = "openrouter"
input_usd_per_mtok = "1.25"
output_usd_per_mtok = "4.25"
reasoning = { effort = "low" }

# Seeds: five families across the three roles, cheapest tiers first.
# Producers seeded on the two most capable flash tiers (run 3's unscripted registrations came
# from GLM and DeepSeek 4.1 producers; runs 4-7's cheapest producers only ever held). Both are
# on Venice at parity, so the seed is not tied to one seller.
[[assemblies]]
id = "seed-observer"
role = "producer"
model_id = "z-ai/glm-5.3-flash"
accepts = ["MarketMid", "Funding"]
max_tokens = 1000
effort = "low"

[[assemblies]]
id = "seed-decider"
role = "producer"
model_id = "deepseek/deepseek-v4.1-flash"
accepts = ["Tick", "Fill"]
max_tokens = 1200
effort = "low"

[[assemblies]]
id = "eval-a"
role = "evaluator"
model_id = "z-ai/glm-5.3-flash"
accepts = ["ProducerReturn"]
max_tokens = 1500
effort = "low"

[[assemblies]]
id = "eval-b"
role = "evaluator"
model_id = "qwen/qwen3.8-flash"
accepts = ["ProducerReturn"]
# Reasoning seeds: a 1500-token budget is spent on reasoning and returns empty
# content on `length`, which is what made the launch roster fail well_formed_rate.
max_tokens = 3000
effort = "low"

[[assemblies]]
id = "eval-c"
role = "evaluator"
model_id = "tencent/hy3"
accepts = ["ProducerReturn"]
max_tokens = 3000
effort = "low"

[[assemblies]]
id = "eval-d"
role = "evaluator"
model_id = "openai/gpt-5.6-luna"
accepts = ["ProducerReturn"]
max_tokens = 1500
effort = "low"

# One antagonist: bounded trouble, judged like a producer, scored on whether it fooled a judge.
[[assemblies]]
id = "antagonist-a"
role = "antagonist"
model_id = "qwen/qwen3.8-flash"
accepts = ["Tick", "MarketMid"]
max_tokens = 2500
effort = "low"

[[assemblies]]
id = "meta-a"
role = "meta"
model_id = "deepseek/deepseek-v4.1-flash"
accepts = ["Verdict"]
max_tokens = 800
effort = "low"

[[assemblies]]
id = "meta-b"
role = "meta"
model_id = "qwen/qwen3.7-flash"
accepts = ["Verdict"]
max_tokens = 800
effort = "low"

[novelty]
trials = 3
max_lifetime_windows = 6
share = 0.1
window = "1h"

[timing]
cadence_sample = 200
min_ratio = 3
jitter_fraction = 0.2

[evaluation]
consequence_share = 0.3
max_forecasts_per_verdict = 2
verdict_timeout_events = 20
min_coverage = 0.5
trial_amount_usd = "0.10"
forecast_horizon_events = 10
adversarial_share = 0.15
sibling_share = 0.5
sampling_step = 0.1
sampling_cap = 0.7

[tools]
population_tool_micro_per_call = 50
max_leverage = 3

[prices]
kappa = 0.5
eta = 0.5
decay = 0.1
lambda_max = 1.0
min_window_events = 1

[termination]
balance_floor_usd = "0"

# Edition 1 passing population cards from docs/charter/edition1-draft.md.
# Observation prose is mapped to catalogue ids; other card fields are preserved.
# Omitted accountabilty_score: verifiability of commitments is not measured.
# Omitted revision_adoption: no link from adopted amendments to prior breaches.
# Omitted practice_revision_rate: no fraction of revision-active windows over ten windows.
# Each card's window is typed ({kind, n, per}) and is the sample actually measured:
# a returns window is the last n returns, a forecasts window the last n settled forecasts.
# No lambda was proposed in the draft; controller defaults apply.
[charter]
norms = ["truthful commitments", "care with scarce resources", "useful inquiry", "the capacity to revise inadequate practices"]

[[charter.cards]]
id = "model_cost_efficiency"
norm = "care with scarce resources"
description = "Total compute cost in micro-USD incurred per well-formed return generated."
units = "micro-USD per return"
window = { kind = "returns", n = 100, per = "role" }
acceptable_region = "at most 500"
observation = "cost_per_return"
answers_for = "producer"

[[charter.cards]]
id = "revision_rate"
norm = "the capacity to revise inadequate practices"
description = "Proportion of returns that include a tool call amendment or register proposal in the window"
units = "fraction"
window = { kind = "returns", n = 100, per = "role" }
acceptable_region = "above 0.05"
observation = "revision_rate"
answers_for = "producer"

[[charter.cards]]
id = "well_formed_rate"
norm = "truthful commitments"
description = "Share of returns that satisfy their declared outcome schema."
units = "fraction"
window = { kind = "returns", n = 100, per = "role" }
acceptable_region = "at least 0.9"
observation = "well_formed_rate"
answers_for = "all"

[[charter.cards]]
id = "verdict_mean_score"
norm = "truthful commitments"
description = "The mean verdict score assigned by evaluators to the producer's returns, reflecting adherence to declared outcomes."
units = "score (0-1)"
window = { kind = "forecasts", n = 50, per = "assembly" }
acceptable_region = "at least 0.8"
observation = "verdict_mean"
answers_for = "producer"

[committee]
min_settled = 5

[immune]
k = 3
bins = 3
tv_threshold = 0.2
gap_threshold = 0.8
gain_step = 0.05
gamma_max = 0.5
decay_step = 0.1

[venue]
# Testnet spot names. ETH/USDC does not exist on testnet, and BTC/USDC there is
# szDecimals 0 at a ~$6,100 mid. A mainnet re-draft names UBTC/USDC and UETH/USDC:
# neither BTC/USDC nor ETH/USDC exists on mainnet either.
spot_pairs = ["PURR/USDC"]
