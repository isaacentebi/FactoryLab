# Edition 2 testnet manifest (docs/plans/edition2.md, W7). The mixed OpenRouter/Venice roster of
# worlds/compute-continuity-testnet.toml (same nine seats and models), live Hyperliquid testnet,
# fake-USD accounting, real prepaid inference. Rehearsal only; no real money moves.
# The charter below is the architect's draft, not ratified: scripts/ratify_charter.py stamps
# the hashes after the testnet committee vote, and the funded manifest is derived from this
# file after that (docs/launch-decisions.md, "Edition 2"). Never name a copy of this `funded`.
name = "edition2-testnet"
seed = 4
# 90 USD: the OpenRouter allowance the launch decisions accept as the finite seed endowment.
initial_balance_usd = "90"
# Ten-minute tick (docs/launch-decisions.md): the final rehearsal at 600 s measured 1,337
# calls and $3.47 a day for these nine seats (docs/audits/v4/gpt6-triage.md).
tick_interval = "600s"

# Contract C1: 30 USD unlocked at genesis, 60 USD locked and released as 10 USD on days 7, 14,
# 21, 28, 35 and 42. Offsets are durations after the ledgered Launch (the loader reads "7d"
# as 7 * NS_PER_DAY). At the rehearsal burn of $3.47 a day the genesis 30 USD lasts about
# 8.6 days and each tranche about 2.9 days, so a population that neither gets cheaper nor
# earns spends part of every week dormant (C2) instead of dying: that is the physics.
[endowment]
locked_micro = 60000000
releases = [
  { at = "7d", amount_micro = 10000000 },
  { at = "14d", amount_micro = 10000000 },
  { at = "21d", amount_micro = 10000000 },
  { at = "28d", amount_micro = 10000000 },
  { at = "35d", amount_micro = 10000000 },
  { at = "42d", amount_micro = 10000000 },
]
# Contract C10: 0.8 of the unlocked pool is split equally across live seats, the rest is
# unallocated. Genesis (kernel/budget.py): 0.8 * 30,000,000 / 9 = 2,666,666 micro-USD a seat,
# 6,000,006 unallocated; each 10 USD tranche adds 888,888 a seat while nine seats live.
base_share = 0.8

[exchange]
# client_namespace is drawn fresh by `scripts/rehearsal.py prepare`; a draft carries none, so
# two preparations of this file never share client order ids.
kind = "hyperliquid"
mainnet = false
coins = ["BTC", "ETH"]

