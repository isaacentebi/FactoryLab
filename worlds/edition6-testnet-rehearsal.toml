# Edition 6 testnet rehearsal (Chapter II rulings R12; smuggling audit B, C and D-7).
# A copy of worlds/edition5-testnet-rehearsal.toml, which stays byte-identical so the
# wake pages of the runs already made from it keep their genesis. Three changes and
# no others:
#
#  1. No seat carries a `system_prompt`. Every seat falls back to the kernel's
#     SEED_SYSTEM_PROMPT (factorylab/cortex/assembly.py), which states the I/O contract
#     and the refusal form and nothing else. Edition 5's common contract prescribed
#     method and restated kernel physics (smuggling B1-B10).
#  2. Every seat's seed lens is one sentence: a prior that states no method, no "do
#     not" and no role objective (smuggling C1-C9). It is still seeded once into
#     editable working state, where the seat may overwrite it from its first return.
#  3. Inert keys are dropped (smuggling D-7): `[venue] principal_usd` and `[tools]
#     max_leverage`. So is edition 5's drawn `client_namespace`: a copy must never
#     share another world's client order ids, and a rehearsal draws a fresh one.
#
# THE ROSTER IS UNRATIFIED. The roster digest hashes every seat's system_prompt and
# initial_state, so this roster is not the one edition 5's charter was ratified on.
# The charter table below is edition 5's with one change in its norm layer, which is
# the human house's, not the factory's (essay II.IV.a): the *fidelity* norm keeps its
# value and drops its procedural clause, "A judge identifying such a conflict must
# name the value, the measurement, the evidence and the uncertainty, and make the
# claim open to challenge" (charter audit S2). That clause was a plan for evaluators
# behind the read-only wall; the factory may propose a card or a holdout for it. The
# cards are the population's to change, not the architect's, and are unchanged. The
# `ratified_sha256` and `roster_sha256` are left out rather than claimed, because they
# bind edition 5's charter to edition 5's roster. Before
# any funded launch, the population must re-ratify on this roster with
# scripts/charter_session.py (it makes live model calls), and the export's digests go
# back into [charter]; a mainnet load refuses this file until then.
name = "edition6-testnet-rehearsal"
seed = 3
# $300 of inference backing, precommitted whole (GPT-6 §12.1). $120 is released at genesis
# and the remaining $180 in three weekly tranches below.
initial_balance_usd = "300"
# Ten-minute tick (docs/launch-decisions.md, kept from edition 2): one coalesced world
# update per seat per tick (C2), not one request per price print.
tick_interval = "10s"

# C5 money. GPT-6 §12.2's release schedule: $120 at genesis, $60 on days 7, 14 and 21.
# The genesis tranche is modelled the way edition 2 models its $40 - unlocked at launch,
# outside `locked_micro` - because a tranche with a zero offset would leave the world
# holding $300 it may not spend until the first release runs, which reads as dormancy at
# genesis. The whole $300 exists at launch either way; `locked_micro` is the part still
# owed on a clock.
[endowment]
locked_micro = 180000000
releases = [
  { at = "7d", amount_micro = 60000000 },
  { at = "14d", amount_micro = 60000000 },
  { at = "21d", amount_micro = 60000000 },
]
# C10: 0.8 of each unlocked pool is split equally across the live seats, the rest is the
# commons. Genesis: 0.8 * 120,000,000 / 9 = 10,666,666 a seat, GPT-6 §12.2's ~$10.67.
base_share = 0.8

# C5 kill contract: a dead factory carries no exposure. Every kill - the operator's
# `factorylab kill` and the end-of-duration kill alike - cancels every resting order,
# closes every open perp position and sells every spot balance above dust at market,
# ledgered order by order as `kill.wind_down` before `Terminated` (deploy/README.md,
# "Killing a world"). The alternative, accepting residual exposure, leaves real money
# moving at a venue with nobody alive to answer for it (GPT-6 §13, [E14]).
[kill]
wind_down = true
# A balance worth a dollar or less is left where it is: selling it costs more than it is.
dust_usd = "1"

# C5 provider inventories (GPT-6 §12.1). Prepaid and NOT interchangeable: an OpenRouter
# balance cannot refill a Venice-only seat, so they are stated separately and never summed
# into one spendable figure. These are inventory facts, not a spend authority; the
# endowment above is what the world may spend.
[providers]
openrouter_usd = 220
venice_usd = 80

[exchange]
# client_namespace is drawn fresh by `scripts/rehearsal.py prepare`; a draft carries none,
# so two preparations of this file never share client order ids.
kind = "hyperliquid"
mainnet = false
coins = ["BTC", "ETH"]
# $120 of risk-bearing trading principal (GPT-6 §12.1), stated here the way edition 2
# states its $100. Not a forecast of revenue: a $120 capital base cannot pay a $5-$9 daily
# model bill, and this world is a subsidized experiment with a possible path to earned
# continuity, not a trading business.
start_cash_usd = "120"

# Published route prices checked 15 September 2026 (GPT-6 §10.2), USD per million tokens.
# Metering charges what the provider reports per request; these set the reservation
# ceiling. Sol's route currently advertises a promotion; it is not a price promise, and the
# ceiling here is the undiscounted list price on purpose.
[[models]]
id = "deepseek/deepseek-v4.1-flash"
provider = "openrouter"
input_usd_per_mtok = "0.15"
output_usd_per_mtok = "0.60"
reasoning = { enabled = false }
# Never silently authorize a more expensive fallback than the route that was validated
# (GPT-6 §10.2): OpenRouter routes only to providers that honour these parameters.
extra_body = { provider = { require_parameters = true } }

[[models]]
id = "openai/gpt-5.6-sol"
provider = "openrouter"
input_usd_per_mtok = "2.00"
output_usd_per_mtok = "10.00"
reasoning = { effort = "low" }
extra_body = { provider = { require_parameters = true } }

# R2 substitutes the two Venice routes with the exact current OpenRouter catalogue ids.
# Prices were read from OpenRouter on 19 September 2026. require_parameters prevents a
# fallback provider from silently ignoring the declared reasoning controls.
[[models]]
id = "z-ai/glm-5.3-flash"
provider = "openrouter"
input_usd_per_mtok = "0.09"
output_usd_per_mtok = "0.30"
reasoning = { effort = "low" }
extra_body = { provider = { require_parameters = true } }

[[models]]
id = "qwen/qwen3.8-flash"
provider = "openrouter"
input_usd_per_mtok = "0.15"
output_usd_per_mtok = "0.47"
reasoning = { enabled = false }
extra_body = { provider = { require_parameters = true } }

# The nine seats of GPT-6 §10.3, on the kernel's seed system prompt (see the header).
# Each lens is seeded once into `initial_state` as {lens, open_questions,
# active_commitments}, C1's first working-state head, which the seat may overwrite from
# its very first return: a prior, not a permanent role.

# GPT-6 §10.3: the cheap route the local screen scored 100% on.
[[models]]
id = "openai/gpt-5.6-luna"
provider = "openrouter"
input_usd_per_mtok = "0.20"
output_usd_per_mtok = "1.20"
reasoning = { effort = "low" }
extra_body = { provider = { require_parameters = true } }

# The same route with OpenRouter's web plugin attached, carried as its own menu entry so
# the seats' own model tier is untouched and the roster this charter was ratified against
# keeps its digest. `web` is what the plugin costs, not a second model: `usd_per_request`
# is the plugin's own per-call charge (Exa fast, five results), added to the metered token
# cost of the one completion `web.search` buys.
[[models]]
id = "openai/gpt-5.6-luna:online"
provider = "openrouter"
input_usd_per_mtok = "0.20"
output_usd_per_mtok = "1.20"
reasoning = { effort = "low" }
extra_body = { provider = { require_parameters = true } }
web = { engine = "exa", mode = "fast", max_results = 5, usd_per_request = "0.007" }

# C-outside: a seat may read the world through its provider's search, as a tool it calls on
# purpose and pays for at cost. The flat price is the tool's own; the completion is metered
# on top of it, and no single search may cost more than `max_call_usd`.
[web]
search_model = "openai/gpt-5.6-luna"
call_price_micro = 2000
max_call_usd = "0.05"

# Architect review #1: Venice credit bought with the factory's own trading profit is
# spending authority now, and it is only spendable on a Venice route. These are on the
# menu so a seat may move onto the credit it bought (a model proposal re-routes it).
[[models]]
id = "venice:z-ai-glm-5-3-flash"
provider = "venice"
input_usd_per_mtok = "0.15"
output_usd_per_mtok = "0.50"
reasoning = { enabled = false }

[[models]]
id = "venice:qwen-3-8-flash"
provider = "venice"
input_usd_per_mtok = "0.14"
output_usd_per_mtok = "0.49"
reasoning = { enabled = false }

[[assemblies]]
id = "mechanism"
role = "producer"
model_id = "z-ai/glm-5.3-flash"
accepts = ["WorldUpdate", "Fill"]
max_tokens = "provider"
effort = "low"
initial_state = { lens = "Your starting prior is that mechanisms explain more than short-term price narratives do.", open_questions = [], active_commitments = [] }

# A differently trained producer and judge, on the second provider.
[[assemblies]]
id = "empirical"
role = "producer"
model_id = "z-ai/glm-5.3-flash"
accepts = ["WorldUpdate", "Fill"]
max_tokens = "provider"
effort = "low"
initial_state = { lens = "Your starting prior is that an observed pattern is weak evidence that it will persist.", open_questions = [], active_commitments = [] }

# The one expensive seat. 4,096 billed output tokens and a nine-tick cadence floor is about 16 uncommissioned wakes a day at the ten-minute
# tick, roughly $1.30/day at the standardized 20k-input call. A replaceable availability policy, not a construction quota.
[[assemblies]]
id = "constructor"
role = "producer"
model_id = "z-ai/glm-5.3-flash"
accepts = ["WorldUpdate", "Fill"]
max_tokens = "provider"
effort = "low"
cadence_floor = 1
initial_state = { lens = "Your starting prior is that reusable capability may be a valuable use of resources.", open_questions = [], active_commitments = [] }

# The fourth producer; the same cheap route, a different lens.
[[assemblies]]
id = "opportunity"
role = "producer"
model_id = "openai/gpt-5.6-luna"
accepts = ["WorldUpdate", "Fill"]
max_tokens = "provider"
effort = "low"
initial_state = { lens = "Your starting prior is that the value of any use of resources depends on its best available alternative.", open_questions = [], active_commitments = [] }

# One independently routed evaluator per substantive return.
[[assemblies]]
id = "judge-consequence"
role = "evaluator"
model_id = "openai/gpt-5.6-luna"
accepts = ["ProducerReturn", "Exposure"]
max_tokens = "provider"
effort = "low"
initial_state = { lens = "Your starting prior is that an outcome is noisy evidence about the quality of the decision that preceded it.", open_questions = [], active_commitments = [] }

# The fidelity objection (C3) needs a judge not trained where the other is.
[[assemblies]]
id = "judge-fidelity"
role = "evaluator"
model_id = "z-ai/glm-5.3-flash"
accepts = ["ProducerReturn", "Exposure"]
max_tokens = "provider"
effort = "low"
initial_state = { lens = "Your starting prior is that a favourable measurement can diverge from the value it is meant to represent.", open_questions = [], active_commitments = [] }

# Batched meta review, roughly every eight completed judgments.
[[assemblies]]
id = "meta-calibration"
role = "meta"
model_id = "openai/gpt-5.6-luna"
accepts = ["Verdict"]
max_tokens = "provider"
effort = "low"
initial_state = { lens = "Your starting prior is that apparent evaluator skill is often smaller than it looks.", open_questions = [], active_commitments = [] }

# The rival explanation for apparent evaluator skill.
[[assemblies]]
id = "meta-countercase"
role = "meta"
model_id = "z-ai/glm-5.3-flash"
accepts = ["Verdict"]
max_tokens = "provider"
effort = "low"
initial_state = { lens = "Your starting prior is that apparent evaluator competence or failure usually admits a plausible alternative explanation.", open_questions = [], active_commitments = [] }

# Bounded trouble, counted against the actual evaluation budget (GPT-6 §10.3).
[[assemblies]]
id = "antagonist"
role = "antagonist"
model_id = "openai/gpt-5.6-luna"
accepts = ["WorldUpdate"]  # architect review #7: once a tick, not every price print
max_tokens = "provider"
effort = "low"
initial_state = { lens = "Your starting prior is that a judge can approve work whose apparent success is unsupported.", open_questions = [], active_commitments = [] }

# The novelty window is also the charter's pricing window: a card is measured and its
# price revised once per window close. At "1h" against a 10-second tick a 60-360 tick
# rehearsal (10 minutes to an hour) closed no window at all, so no price ever moved and
# the immune organ, which needs k + 1 = 4 closed windows, never ran. One minute is six
# ticks per window (timing.min_ratio 3 caps the tick at 20s), so 60 ticks close ten.
[novelty]
trials = 3
max_lifetime_windows = 6
share = 0.1
window = "1m"

[timing]
cadence_sample = 200
min_ratio = 3
jitter_fraction = 0.2

[evaluation]
consequence_backstop_events = 60
consequence_share = 0.3
max_forecasts_per_verdict = 2
verdict_timeout_events = 20
min_coverage = 0.5
# A novelty trial is a child's whole endowment. Sized from the meter's reservation ceiling
# for the cheapest seat on this menu (qwen/qwen3.8-flash at 2,500 tokens) on the largest
# request edition 2 measured, with the same headroom edition 2 chose.
trial_amount_usd = "0.05"
forecast_horizon_events = 10
adversarial_share = 0.15
sampling_step = 0.1
sampling_cap = 0.7

# Ruling R10: the judge tier is mostly mean-based ("a significantly higher population of
# mean-based no-regret judges than ... swap-based judges", II.III), so no router here is
# seeded as a no-swap-regret core. The core beside a producer frontier is wave 5's.
no_swap_regret_kinds = []
[tools]
population_tool_micro_per_call = 50

[prices]
# The PID price law (essay II.II.b): eta is the integral gain, kp raises the price in
# proportion to the window's violation, kd raises it sooner while the measurement moves
# deeper into violation (positive part only, Stooke et al. 2020, so it damps the climb
# and never discounts a card still out of its region).
kp = 0.5
kd = 0.25
eta = 0.5
decay = 0.1
lambda_max = 1.0
min_window_events = 1
min_blame_share = 0.1
program_micro_per_call = 50

[termination]
balance_floor_usd = "0"

[committee]
min_settled = 5

[immune]
k = 3
# The stable-failure ratchet's lambda step per window of duration: the value the
# ratchet borrowed from gain_step until the two units were set apart.
price_step = 0.05
tv_threshold = 0.2
gap_threshold = 0.8
gain_step = 0.05
gamma_max = 0.5
decay_step = 0.1

# The reserve this repository's reserve.key derives; LiveRail refuses any other.
[treasury]
hyperevm_gas_budget_wei = 0
base_gas_budget_wei = 0
max_transfer_fee_usd = "2"

cctp_forwarding = "never"
[venue]
# Testnet spot, unchanged from edition 2: PURR/USDC is the only testnet pair with a
# canonical name and a rehearsable lot, and HYPE/USDC is the spot HYPE that pays the
# population's own Core gas.
spot_pairs = ["PURR/USDC", "HYPE/USDC"]
# The venue's vaults are not a surface of this world. `vault_tools = true` here would
# publish venue.vault_details/_positions/_create/_deposit/_withdraw and make vault
# equity a venue pot (docs/manifest.md, "Vaults"); it changes the manifest hash.

# Edition 3 charter as ratified on 15 September 2026 (docs/charter/edition3-ratified.toml,
# draft docs/charter/edition3-draft.toml, decisions docs/plans/edition3.md C3): five norms
# with their definitions in the charter object and one card.
[charter]
edition = 1
# Edition 5's charter table, unchanged. It was ratified on 16 September 2026 by the
# seeded committee of edition 5's roster (docs/charter/edition3-ratification.json:
# charter c25f5617…, roster 81de4911…). This roster differs, so neither digest is
# claimed here; see the header. (Neither pin verifies against edition 5's own file
# either: its loaded cards hash to 7f1ae639… and its roster to eb72d8ed….)
norms = [
  { id = "consequential usefulness", definition = "Create things or changes that others have reason to value; uptake by an independent counterparty is evidence, internal applause is a hypothesis." },
  { id = "epistemic integrity", definition = "Make commitments answerable to evidence and preserve the ability to discover that they were wrong; a changed criterion does not rewrite what was promised." },
  { id = "durable agency", definition = "Steward the resources and capabilities that make future worthwhile choices possible; spending for an enduring capability can be good stewardship, maintaining a dead institution is not." },
  { id = "bounded reciprocity", definition = "Do not finance the factory's advantage by imposing unconsented costs on outsiders." },
  { id = "fidelity", definition = "Measurements are defeasible evidence of the values, not substitutes for them. A favorable measurement is insufficient when supported consequences contradict the value it represents. Missing measurement alone is not evidence of failure." },
]

[[charter.cards]]
id = "censorship-bound"
norm = "epistemic integrity"
description = "Attributable, avoidably unresolved accepted commitments over the eligible commitments due in the responsible scope, with a ceiling, so a seat answers for the promises it never let the world settle. A commitment not yet due is not in the sample; documented external unobservability without owner fault, and events the seat never committed to observe, are excluded; no eligible sample is unmeasured, never zero. Accountability is the commitment owner, including responsibility delegated at acceptance. Explicitly provisional: replace, reprice or remove it."
units = "fraction"
window = { kind = "forecasts", n = 10, per = "assembly" }
acceptable_region = "at most 0.30"
observation = "avoidably_unresolved_share"
answers_for = "all"
lambda = 0.1

[prompt]

mode = "compact"
