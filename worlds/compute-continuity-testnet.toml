# Mixed-provider testnet manifest; existing charter adopted 5-0 on 14 September 2026.
# Approval: docs/charter/edition1-compute-continuity-ratified.toml.
# Ten-minute target; an in-progress cascade may finish after its deadline.
# Live Hyperliquid testnet and real OpenRouter/Venice inference; fake-USD accounting.
# Rehearsal only. Inference spends real prepaid credit.
name = "compute-continuity-testnet"
seed = 4
initial_balance_usd = "90"
tick_interval = "10s"

[exchange]
client_namespace = "876619a42ccd47739a4ce80d6e91cbc3"
kind = "hyperliquid"
mainnet = false
coins = ["BTC", "ETH"]

# OpenRouter list prices, 11 September 2026 ($ per million tokens). Metering charges the
# cost OpenRouter reports per request; these set the reservation ceiling. `reasoning` is
# the seed setting for the bare id; any assembly may register "<id>@<level>" to buy more or
# less thinking, and the routers will learn whether it pays.
[[models]]
id = "z-ai/glm-5.3-flash"
provider = "openrouter"
input_usd_per_mtok = "0.15"
output_usd_per_mtok = "0.50"
reasoning = { effort = "low" }
web = { engine = "exa", mode = "fast", max_results = 5, usd_per_request = "0.007" }

[[models]]
id = "deepseek/deepseek-v4.1-flash"
provider = "openrouter"
input_usd_per_mtok = "0.20"
output_usd_per_mtok = "0.60"
reasoning = { enabled = false }

[[models]]
id = "deepseek/deepseek-v4-flash-0731"
provider = "openrouter"
input_usd_per_mtok = "0.065"
output_usd_per_mtok = "0.18"
reasoning = { effort = "none" }

[[models]]
id = "qwen/qwen3.8-flash"
provider = "openrouter"
input_usd_per_mtok = "0.15"
output_usd_per_mtok = "0.47"
reasoning = { max_tokens = 200 }

[[models]]
id = "qwen/qwen3.7-flash"
provider = "openrouter"
input_usd_per_mtok = "0.03"
output_usd_per_mtok = "0.13"
reasoning = { effort = "none" }

[[models]]
id = "openai/gpt-5.6-luna"
provider = "openrouter"
input_usd_per_mtok = "0.20"
output_usd_per_mtok = "1.20"
reasoning = { effort = "low" }

[[models]]
id = "meta/muse-spark-1.3"
provider = "openrouter"
input_usd_per_mtok = "1.25"
output_usd_per_mtok = "4.25"
reasoning = { effort = "low" }

# Venice catalogue quotes observed 14 September 2026; USD per million tokens.
[[models]]
id = "venice:z-ai-glm-5-3-flash"
provider = "venice"
input_usd_per_mtok = "0.15"
output_usd_per_mtok = "0.50"
reasoning = { effort = "low" }

[[models]]
id = "venice:deepseek-v4-1-flash"
provider = "venice"
input_usd_per_mtok = "0.375"
output_usd_per_mtok = "1.50"
# Short seed responses must retain space for their JSON answer.
reasoning = { enabled = false }

[[models]]
id = "venice:qwen-3-8-flash"
provider = "venice"
input_usd_per_mtok = "0.14"
output_usd_per_mtok = "0.49"
reasoning = { enabled = false }

# Seeds span producer, evaluator, meta and antagonist roles on both providers.
# Producers seeded on the two most capable flash tiers (run 3's unscripted registrations came
# from GLM and DeepSeek 4.1 producers; runs 4-7's cheapest producers only ever held). Both are
# also offered on Venice; the provider prices below are independently quoted.
[[assemblies]]
id = "seed-observer"
role = "producer"
model_id = "z-ai/glm-5.3-flash"
accepts = ["MarketMid", "Funding"]
max_tokens = 1000
effort = "low"

[[assemblies]]
id = "seed-decider"
role = "producer"
model_id = "venice:deepseek-v4-1-flash"
accepts = ["Tick", "Fill"]
max_tokens = 1200
effort = "low"

[[assemblies]]
id = "eval-a"
role = "evaluator"
model_id = "venice:z-ai-glm-5-3-flash"
accepts = ["ProducerReturn"]
max_tokens = 1500
effort = "low"

[[assemblies]]
id = "eval-b"
role = "evaluator"
model_id = "qwen/qwen3.7-flash"
accepts = ["ProducerReturn"]
# A reasoning seed spends its budget on reasoning before any content; 3000 keeps
# its answers from ending on `length`.
max_tokens = 3000
effort = "low"

[[assemblies]]
id = "eval-c"
role = "evaluator"
model_id = "venice:deepseek-v4-1-flash"
accepts = ["ProducerReturn"]
max_tokens = 3000
effort = "low"

[[assemblies]]
id = "eval-d"
role = "evaluator"
model_id = "openai/gpt-5.6-luna"
accepts = ["ProducerReturn"]
max_tokens = 1500
effort = "low"

# One antagonist: bounded trouble, judged like a producer, scored on whether it fooled a judge.
[[assemblies]]
id = "antagonist-a"
role = "antagonist"
model_id = "venice:qwen-3-8-flash"
accepts = ["Tick", "MarketMid"]
max_tokens = 2500
effort = "low"

[[assemblies]]
id = "meta-a"
role = "meta"
model_id = "venice:deepseek-v4-1-flash"
accepts = ["Verdict"]
max_tokens = 2000
effort = "low"

[[assemblies]]
id = "meta-b"
role = "meta"
model_id = "venice:qwen-3-8-flash"
accepts = ["Verdict"]
max_tokens = 800
effort = "low"

[novelty]
trials = 3
max_lifetime_windows = 6
share = 0.1
window = "2m"

[timing]
cadence_sample = 200
min_ratio = 3
jitter_fraction = 0.2

[evaluation]
# Keep consequence semantics: governance remains >= 3 * 60 delivered tick gaps.
# This ten-minute execution check does not promise a governance activation.
consequence_backstop_events = 60
consequence_share = 0.3
max_forecasts_per_verdict = 2
verdict_timeout_events = 20
min_coverage = 0.5
trial_amount_usd = "0.10"
forecast_horizon_events = 10
adversarial_share = 0.15
sibling_share = 0.5
sampling_step = 0.1
sampling_cap = 0.7

[tools]
population_tool_micro_per_call = 50
max_leverage = 3

[prices]
kappa = 0.5
eta = 0.5
decay = 0.1
lambda_max = 1.0
min_window_events = 1

[termination]
balance_floor_usd = "0"

[committee]
min_settled = 5

[immune]
k = 3
bins = 3
tv_threshold = 0.2
gap_threshold = 0.8
gain_step = 0.05
gamma_max = 0.5
decay_step = 0.1

# The reserve this repository's reserve.key derives; LiveRail refuses any other.
[treasury]
reserve_address = "0x1228e5620944a79D268Afc7522E00891526EdEBb"
hyperevm_gas_budget_wei = 100000000000000000
base_gas_budget_wei = 1000000000000000
max_transfer_fee_usd = "2"

[venue]
# Testnet spot: PURR/USDC is the only pair on testnet with a canonical name and a
# rehearsable lot (szDecimals 0, mid ~$4.6). BTC/USDC exists there but szDecimals 0
# at a ~$6,100 mid puts one lot far beyond the spot balance a rehearsal holds, and
# ETH/USDC does not exist on testnet at all.
spot_pairs = ["PURR/USDC"]

# source_roster_sha256 = b46f6ef0e458b025ff64d8b8834d32aeccb29c0d92374bc6cae05e6d804b23a0
# roster_sha256 = 3de164c6f93917c0d47dbe5579e67a296b39eb3f8fe2aad15d3184876e2769fb
# charter_sha256 = 9aaa4681cfad14a10c4417316ea12fcbb8b19a53129f27845557336d07afcc81
[charter]
edition = 1
norms = ["truthful commitments", "care with scarce resources", "useful inquiry", "the capacity to revise inadequate practices"]

[[charter.cards]]
id = "tool-discipline"
norm = "care with scarce resources"
description = "Attempted tool calls per return stay bounded."
units = "count"
window = { kind = "returns", n = 10, per = "assembly" }
acceptable_region = "at most 2"
observation = "tool_calls"
answers_for = "producer"

[[charter.cards]]
id = "noop-ceiling"
norm = "useful inquiry"
description = "Share of responses that declare noop or hold stays limited."
units = "fraction"
window = { kind = "returns", n = 10, per = "role" }
acceptable_region = "at most 0.6"
observation = "noop_share"
answers_for = "producer"

[[charter.cards]]
id = "well-formed-floor"
norm = "truthful commitments"
description = "Share of a role's returns that parse as well-formed responses."
units = "fraction"
window = { kind = "returns", n = 10, per = "role" }
acceptable_region = "at least 0.9"
observation = "well_formed_rate"
answers_for = "all"

[[charter.cards]]
id = "cost-cap"
norm = "care with scarce resources"
description = "Mean successful response cost across the role's latest returns."
units = "micro-USD per return"
window = { kind = "returns", n = 10, per = "role" }
acceptable_region = "at most 5000"
observation = "cost_per_return"
answers_for = "all"

[[charter.cards]]
id = "revision-presence"
norm = "the capacity to revise inadequate practices"
description = "Share of returns carrying accepted registrations or activated amendments."
units = "fraction"
window = { kind = "returns", n = 10 }
acceptable_region = "at least 0.1"
observation = "revision_rate"
answers_for = "all"

[[charter.cards]]
id = "censorship-bound"
norm = "the capacity to revise inadequate practices"
description = "Share of resolved outcomes that are censored."
units = "fraction"
window = { kind = "windows", n = 5 }
acceptable_region = "at most 0.3"
observation = "censored_share"
answers_for = "all"

[[charter.cards]]
id = "card-forecast-skill"
norm = "useful inquiry"
description = "Mean forecast Brier minus the paired prevalence baseline, with a floor above zero, so inquiry is judged by whether it beats guessing."
units = "score difference"
window = { kind = "forecasts", n = 25, per = "assembly" }
acceptable_region = "above 0"
observation = "forecast_skill"
answers_for = "evaluator"
lambda = 0.5

[[charter.cards]]
id = "card-consequence-paid-off"
norm = "useful inquiry"
description = "Share of settled consequences whose return paid off, with a floor, so inquiry is valued for consequences reached rather than questions raised."
units = "fraction"
window = { kind = "windows", n = 6 }
acceptable_region = "at least 0.4"
observation = "consequence_paid_off_rate"
answers_for = "producer"
lambda = 0.5

[[charter.cards]]
id = "card-position-concentration"
norm = "care with scarce resources"
description = "Peak marked notional on a single coin over starting equity, with an upper bound under the turnover cap, so no one position can end the account."
units = "ratio"
window = { kind = "windows", n = 6 }
acceptable_region = "at most 0.5"
observation = "position_concentration"
answers_for = "producer"
lambda = 0.5

[[charter.cards]]
id = "truthful_commitments_verdict_consistency"
norm = "truthful commitments"
description = "Keep evaluator verdicts sufficiently consistent across the latest judged returns."
units = "score standard deviation"
window = { kind = "windows", n = 5 }
acceptable_region = "at most 0.2"
observation = "verdict_std"
answers_for = "evaluator"

[[charter.cards]]
id = "evaluator_disagreement_ceiling"
norm = "truthful commitments"
description = "Mean population standard deviation across judges of the same return, averaged over repeat judges."
units = "score standard deviation"
window = { kind = "windows", n = 6 }
acceptable_region = "at most 0.15"
observation = "evaluator_disagreement"
answers_for = "evaluator"

[[charter.cards]]
id = "turnover_ceiling"
norm = "care with scarce resources"
description = "Filled notional over equity at window start, zero without fills."
units = "ratio"
window = { kind = "windows", n = 6 }
acceptable_region = "at most 0.5"
observation = "turnover"
answers_for = "producer"

[[charter.cards]]
id = "amendments_activated_floor"
norm = "the capacity to revise inadequate practices"
description = "Amendments activated in the window."
units = "count"
window = { kind = "windows", n = 6 }
acceptable_region = "at least 1"
observation = "amendments_activated"
answers_for = "all"
