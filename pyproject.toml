[project]
name = "factorylab"
version = "0.4.0"
description = "A bounded experimental world informed by The Superdark Factory: one wallet, a deterministic nervous system, ephemeral LLM assemblies."
requires-python = ">=3.13"
dependencies = [
    "hyperliquid-python-sdk>=0.24.0",
    "anthropic>=0.80.0",
    "cryptography>=43.0",
]

[project.scripts]
factorylab = "factorylab.runtime.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-xdist>=3.8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factorylab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "fast: tests without a world-run import or shared scripted fixture",
    "world: tests importing run_world or consuming shared scripted fixtures",
    "network: requires network access (deselected in CI)",
    "slow: kills and resumes real subprocesses; run before merging to main (`-m ''`)",
]
addopts = "-m 'not network and not slow' -n auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
