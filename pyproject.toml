[project]
name = "factorylab"
version = "0.4.0"
description = "A bounded experimental world informed by The Superdark Factory: one wallet, a deterministic nervous system, ephemeral LLM assemblies."
requires-python = ">=3.13"
dependencies = [
    "hyperliquid-python-sdk>=0.24.0",
    "cryptography>=43.0",
]

[project.scripts]
factorylab = "factorylab.runtime.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-xdist>=3.8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factorylab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tiers (tests/conftest.py assigns check/gate at collection):
#   check  the inner loop and the default: no test runs a world; each call under 2 s
#          of CPU and 10 s of wall time
#   gate   runs a world or reads a shared scripted run; run before a merge
#   slow   kills and resumes real subprocesses
#   soak   the long runs: the checkpoint plateau and the gauntlet's long worlds;
#          required for any change under factorylab/ or to the gauntlet (docs
#          exempt), before any world launch, and on request (AGENTS.md; a whole
#          gate run enforces it)
# A bare `uv run pytest` runs `check` on 2 workers. The merge gate is
# `uv run pytest -m "check or gate" -n 4`; more workers: `-n 8`, or `-n auto` for all
# cores (hot on a laptop). The last `-m`/`-n` on the command line wins over these.
# `--dist loadgroup` keeps a module that shares a world fixture on one worker.
markers = [
    "check: the developer inner loop; runs no world (the default selection)",
    "gate: runs a world or consumes a shared scripted fixture",
    "fast: old name of check, still set on every check test",
    "world: old name of gate, still set on every gate test",
    "network: requires network access (deselected in CI)",
    "slow: kills and resumes real subprocesses; run before merging to main",
    "soak: long runs (-m soak): REQUIRED for any change under factorylab/ or to the gauntlet (docs exempt); before any world launch; on request (a whole gate run enforces it; AGENTS.md)",
]
addopts = "-m check -n 2 --dist loadgroup"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
